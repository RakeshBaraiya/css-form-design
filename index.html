 <!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,intial-scale=1.0" />
    <title>css form design</title>
    <style>
      .myform {
        width: 520px;
        height: 445px;
        margin: 150px auto;
        border-radius: 5px;
        /**background-image: linear-gradient(angle, color-stop1, color-stop2); **/
        background-image: -webkit-linear-gradient(top, #3b3b3b, #373737);
      }
      .myform > div.cacc {
        height: 77px;
        border-bottom: 1px solid #1b1b1b;
        text-align: center;
        line-height: 67px;
        color: #fff;
        font-size: 1.5em;
        font-family: Arial, Helvetica, sans-serif;
        text-shadow: 0px -2px 1px rgba(0, 0, 0, 0.5);
      }
      .myform > div > input {
        width: 475px;
        height: 38px;
        border-radius: 25px;
        margin: auto;
        display: block;
        margin: 7px auto;
        background-image: -webkit-linear-gradient(top, #b1b1b1, #d7d7d7);
      }
      .tnc {
        font-size: 1em !important;
        text-align: left !important;
        color: #fff;
      }
    </style>
    </head>
    <body>
       <form class="myform">
         <div class="cacc">Create an Account</div>
          <div>
          <input type="text" />
          <input type="number" />
          <input type="email" />
          <input type="password" />
          <div class="tnc">  I agree to the Term and Condition and Privacy Policy
           </div>
           </div>
        </form>
    </body>
</html>
